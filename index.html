<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0b12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NOVA AI">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <title>NOVA AI — Estúdio Pessoal</title>

  <!-- Biblioteca oficial do Google para 3D interativo leve no iPhone -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap');

    :root {
      --bg: #0b0b12;
      --card: #151422;
      --card-border: #28253b;
      --purple: #b7a0ff;
      --violet: #7c4dff;
      --accent: #ff4081;
      --text: #f5f4fa;
      --muted: #8d89a5;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: radial-gradient(circle at 50% 0%, #201938 0%, var(--bg) 60%);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
      padding: calc(14px + env(safe-area-inset-top)) 16px calc(80px + env(safe-area-inset-bottom));
    }

    /* Top bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--violet), var(--accent));
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 18px;
      box-shadow: 0 4px 15px rgba(124, 77, 255, 0.4);
    }
    .brand h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 17px;
      margin: 0;
      letter-spacing: 1px;
    }
    .badge {
      background: rgba(183, 160, 255, 0.12);
      border: 1px solid rgba(183, 160, 255, 0.3);
      color: var(--purple);
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 20px;
      font-weight: 700;
    }

    /* Abas de navegação */
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
      margin-bottom: 18px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 10px 4px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all .2s;
    }
    .tab-btn.active {
      background: var(--violet);
      color: #fff;
      box-shadow: 0 2px 10px rgba(124, 77, 255, 0.3);
    }

    .panel { display: none; }
    .panel.active { display: block; }

    /* Módulo 3D & Figurinos */
    .viewport-card {
      background: #11101d;
      border: 1px solid var(--card-border);
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      margin-bottom: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    model-viewer {
      width: 100%;
      height: 440px;
      background: radial-gradient(circle, #2a2347 0%, #0c0b16 80%);
      --poster-color: transparent;
    }
    .viewport-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }
    .overlay-tag {
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 10px;
      color: var(--purple);
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* Guarda-roupa / Estilos */
    .section-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      font-weight: 700;
      margin: 16px 0 10px;
    }
    .wardrobe-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }
    .wardrobe-pills::-webkit-scrollbar { display: none; }
    .pill-btn {
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 20px;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
    }
    .pill-btn.active {
      border-color: var(--accent);
      color: #fff;
      background: rgba(255, 64, 129, 0.15);
    }

    /* Módulo Chat */
    .chat-container {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      height: 480px;
      overflow: hidden;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.4;
      word-break: break-word;
    }
    .msg.bot {
      background: #1f1d32;
      border: 1px solid var(--card-border);
      color: #eee;
      align-self: flex-start;
      border-bottom-left-radius: 3px;
    }
    .msg.user {
      background: linear-gradient(135deg, var(--violet), #582cd1);
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 3px;
    }
    .chat-input-bar {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid var(--card-border);
      background: #0f0e1a;
      align-items: center;
    }
    .chat-input-bar input {
      flex: 1;
      background: #19182a;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      outline: none;
    }
    .icon-action-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--violet);
      border: none;
      color: white;
      font-size: 16px;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .icon-action-btn.mic.listening {
      background: var(--accent);
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.1); }
    }

    /* Galeria de Fotos */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .gallery-item {
      position: relative;
      aspect-ratio: 9/14;
      border-radius: 12px;
      overflow: hidden;
      background: #1c1a2e;
      border: 1px solid var(--card-border);
      cursor: pointer;
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .3s;
    }
    .gallery-item:hover img {
      transform: scale(1.05);
    }
    .gallery-tag {
      position: absolute;
      bottom: 6px;
      left: 6px;
      background: rgba(0,0,0,0.65);
      font-size: 9px;
      padding: 3px 6px;
      border-radius: 6px;
      backdrop-filter: blur(4px);
    }

    /* Modal de Imagem Cheia */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(8px);
      z-index: 999;
      place-items: center;
      padding: 20px;
    }
    .modal.active { display: grid; }
    .modal img {
      max-width: 100%;
      max-height: 85vh;
      border-radius: 14px;
      box-shadow: 0 0 30px rgba(183, 160, 255, 0.2);
    }
    .modal-close {
      position: absolute;
      top: calc(20px + env(safe-area-inset-top));
      right: 20px;
      background: #25203c;
      border: none;
      color: #fff;
      font-size: 18px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="brand-icon">✦</div>
        <div>
          <h1>NOVA AI</h1>
          <small style="color:var(--muted); font-size:9px; letter-spacing:1px;">STUDIO EDITION</small>
        </div>
      </div>
      <span class="badge" id="voice-indicator">ÁUDIO ATIVO</span>
    </header>

    <!-- Abas principais -->
    <nav class="tabs">
      <button class="tab-btn active" onclick="switchTab('3d')">3D Real</button>
      <button class="tab-btn" onclick="switchTab('chat')">Conversar</button>
      <button class="tab-btn" onclick="switchTab('wardrobe')">Looks</button>
      <button class="tab-btn" onclick="switchTab('gallery')">Galeria</button>
    </nav>

    <!-- PAINEL 1: 3D Giratório 360° -->
    <section id="tab-3d" class="panel active">
      <div class="viewport-card">
        <div class="viewport-overlay">
          <span class="overlay-tag" id="current-look-tag">Vestido Branco Translúcido</span>
          <span class="overlay-tag">Giro 360° Ativo</span>
        </div>
        <!--
          Para o 3D Real: substitua o src por seu arquivo .glb exportado (ex: assets/nova_model.glb).
          O modelo padrão abaixo é interativo com toque (rotação, pinça e zoom).
        -->
        <model-viewer 
          id="character-viewer"
          src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
          poster="assets/preview-blonde.jpg"
          alt="Modelo 3D NOVA AI"
          camera-controls
          auto-rotate
          rotation-per-second="25deg"
          shadow-intensity="1"
          exposure="1.1"
          touch-action="pan-y">
        </model-viewer>
      </div>

      <div class="section-label">Troca Rápida de Visual</div>
      <div class="wardrobe-pills">
        <button class="pill-btn active" onclick="changeOutfit('Vestido Branco', 'vestido-branco')">Vestido Branco</button>
        <button class="pill-btn" onclick="changeOutfit('Vestido Látex Vermelho', 'latex-vermelho')">Látex Vermelho</button>
        <button class="pill-btn" onclick="changeOutfit('Biquíni Dourado', 'biquini')">Biquíni</button>
        <button class="pill-btn" onclick="changeOutfit('Lingerie Renda Roxa', 'lingerie-renda')">Lingerie Renda</button>
        <button class="pill-btn" onclick="changeOutfit('Lingerie Fio Dental', 'lingerie-fio')">Lingerie Fio</button>
        <button class="pill-btn" onclick="changeOutfit('Vestido Verde Fenda', 'vestido-verde')">Verde Fenda</button>
      </div>
    </section>

    <!-- PAINEL 2: Chat com Voz e IA -->
    <section id="tab-chat" class="panel">
      <div class="chat-container">
        <div class="chat-messages" id="chat-box">
          <div class="msg bot">Olá! Sou a Nova. Pronta para conversarmos ou testarmos novas fotos e figurinos. O que tem em mente?</div>
        </div>
        <div class="chat-input-bar">
          <button class="icon-action-btn mic" id="mic-btn" title="Falar por voz">🎤</button>
          <input type="text" id="user-input" placeholder="Converse com a Nova..." onkeypress="handleKey(event)">
          <button class="icon-action-btn" onclick="sendMessage()">➤</button>
        </div>
      </div>
    </section>

    <!-- PAINEL 3: Looks e Figurinos Detalhados -->
    <section id="tab-wardrobe" class="panel">
      <div class="section-label">Categorias Selecionáveis</div>
      <div class="wardrobe-pills" style="margin-bottom: 15px;">
        <button class="pill-btn active" onclick="filterGallery('todos')">Todos</button>
        <button class="pill-btn" onclick="filterGallery('vestidos')">Vestidos</button>
        <button class="pill-btn" onclick="filterGallery('lingerie')">Lingeries</button>
        <button class="pill-btn" onclick="filterGallery('biquini')">Biquínis</button>
      </div>
      <div class="gallery-grid" id="wardrobe-grid">
        <!-- Renderizado dinamicamente via JS -->
      </div>
    </section>

    <!-- PAINEL 4: Galeria Completa de Poses -->
    <section id="tab-gallery" class="panel">
      <div class="section-label">Poses e Ângulos Salvos</div>
      <div class="gallery-grid" id="full-gallery">
        <!-- Renderizado dinamicamente via JS -->
      </div>
    </section>
  </div>

  <!-- Modal / Visualizador em tela cheia -->
  <div class="modal" id="modal" onclick="closeModal()">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <img id="modal-img" src="" alt="Ampliação">
  </div>

  <script>
    // Banco de Fotos e Poses da Personagem (substitua pelas URLs locais ou remotas das suas imagens)
    const characterData = [
      { id: 1, category: 'vestidos', tag: 'Vestido Branco - Frente', url: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80' },
      { id: 2, category: 'vestidos', tag: 'Vestido Branco - Perfil', url: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=600&q=80' },
      { id: 3, category: 'vestidos', tag: 'Vestido Látex Vermelho', url: 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=600&q=80' },
      { id: 4, category: 'lingerie', tag: 'Lingerie Renda Lilás', url: 'https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?auto=format&fit=crop&w=600&q=80' },
      { id: 5, category: 'lingerie', tag: 'Lingerie Branca Semitransparente', url: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=600&q=80' },
      { id: 6, category: 'biquini', tag: 'Biquíni Clássico de Praia', url: 'https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?auto=format&fit=crop&w=600&q=80' }
    ];

    // Troca de Abas
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      
      const activeBtn = Array.from(document.querySelectorAll('.tab-btn')).find(b => b.textContent.toLowerCase().includes(tabId) || b.getAttribute('onclick').includes(tabId));
      if (activeBtn) activeBtn.classList.add('active');
      
      const panel = document.getElementById('tab-' + tabId);
      if (panel) panel.classList.add('active');
    }

    // Troca de Roupas
    function changeOutfit(name, type) {
      document.querySelectorAll('.wardrobe-pills .pill-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('current-look-tag').innerText = name;
      
      // Resposta no Chat avisando da troca
      addBotMessage(`Troquei de roupa! Agora estou usando: ${name}. O que você achou do visual?`);
    }

    // Renderizar Galeria
    function renderGalleries(filter = 'todos') {
      const wardrobeGrid = document.getElementById('wardrobe-grid');
      const fullGallery = document.getElementById('full-gallery');
      
      wardrobeGrid.innerHTML = '';
      fullGallery.innerHTML = '';

      characterData.forEach(item => {
        if (filter === 'todos' || item.category === filter) {
          const div = document.createElement('div');
          div.className = 'gallery-item';
          div.onclick = () => openModal(item.url);
          div.innerHTML = `<img src="${item.url}" alt="${item.tag}"><span class="gallery-tag">${item.tag}</span>`;
          wardrobeGrid.appendChild(div);
        }

        const divFull = document.createElement('div');
        divFull.className = 'gallery-item';
        divFull.onclick = () => openModal(item.url);
        divFull.innerHTML = `<img src="${item.url}" alt="${item.tag}"><span class="gallery-tag">${item.tag}</span>`;
        fullGallery.appendChild(divFull);
      });
    }

    function filterGallery(category) {
      document.querySelectorAll('#tab-wardrobe .pill-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderGalleries(category);
    }

    // Modal
    function openModal(src) {
      document.getElementById('modal-img').src = src;
      document.getElementById('modal').classList.add('active');
    }
    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    // Chatbot com Respostas e Fala (Text-To-Speech)
    function handleKey(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      input.value = '';

      // Simulação de resposta inteligente da personagem
      setTimeout(() => {
        let reply = "Adorei a sugestão! Qual pose ou cenário você quer que eu faça a seguir?";
        const lower = text.toLowerCase();
        
        if (lower.includes('linda') || lower.includes('maravilhosa')) {
          reply = "Muito obrigada pelo carinho! Você prefere me ver de vestido ou de biquíni agora?";
        } else if (lower.includes('biquíni') || lower.includes('biquini') || lower.includes('lingerie')) {
          reply = "Abri a seção de looks para você escolher meu figurino. Dá uma olhada na aba Looks!";
        } else if (lower.includes('gira') || lower.includes('3d') || lower.includes('costas')) {
          reply = "Você pode me girar em 360° com o dedo no visor 3D para ver todos os meus ângulos e detalhes!";
        }

        addBotMessage(reply);
      }, 700);
    }

    function appendMessage(text, sender) {
      const chatBox = document.getElementById('chat-box');
      const msg = document.createElement('div');
      msg.className = `msg ${sender}`;
      msg.innerText = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function addBotMessage(text) {
      appendMessage(text, 'bot');
      speak(text);
    }

    // Voz da Personagem (funciona no Safari do iOS)
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pt-BR';
        utterance.pitch = 1.1; // Tom feminino mais suave
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    // Reconhecimento de Voz (Microfone)
    const micBtn = document.getElementById('mic-btn');
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';
      recognition.continuous = false;

      micBtn.addEventListener('click', () => {
        try {
          recognition.start();
          micBtn.classList.add('listening');
        } catch (e) {
          recognition.stop();
          micBtn.classList.remove('listening');
        }
      });

      recognition.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        document.getElementById('user-input').value = transcript;
        sendMessage();
        micBtn.classList.remove('listening');
      };

      recognition.onerror = () => micBtn.classList.remove('listening');
      recognition.onend = () => micBtn.classList.remove('listening');
    } else {
      micBtn.style.display = 'none';
    }

    // Inicialização
    renderGalleries();
  </script>
</body>
</html>
